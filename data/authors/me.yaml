experience:
  - role: Freelance Data Engineer & Data Scientist
    org: upwerk
    start: 2024-07-01
    end: Present
    summary: |
      - Designed, implemented and deployed a Databricks Lakehouse for an e-commerce retailer, integrating sales, customer, product, inventory and order data. Implemented Medallion Architecture, CDC-based ingestion, SCD Type 1/2 and incremental processing using PySpark, Delta Lake, Auto Loader and AUTO CDC. Established Unity Catalog governance, data quality validation, pipeline orchestration and CI/CD using GitHub Actions and Databricks Asset Bundles.
      - Developed and deployed a customer-facing AI support chatbot for an e-commerce business using the OpenAI API and Retrieval-Augmented Generation (RAG). Implemented embedding-based retrieval with a vector database and integrated function calling with order management and internal business systems to retrieve order information and automate customer enquiries.
      - Developed a business intelligence and predictive analytics solution for a software company, consolidating sales transactions, customer records, invoices, operational and geographic data using Python, SQL and Excel. Built Power BI dashboards, automated reporting workflows and traditional machine learning models for customer segmentation and repeat-purchase prediction, identifying purchasing patterns and customers likely to make repeat purchases.
      - Developed a tool-using AI trip-planning agent for a travel business offering holiday packages worldwide. Integrated external geospatial data and travel-guide retrieval through structured tool calling, implementing point-of-interest validation, itinerary refinement and day-specific itinerary regeneration while preserving unchanged days. Added persistent feedback and interactive map visualisations to support itinerary exploration.
      - Designed and deployed a Django-based records management application for a tourist association, replacing fragmented spreadsheets with a centralised system. Designed the SQL database schema, migrated existing records and implemented CRUD operations, search, filtering, data exports and trend visualisation across membership, historical, event, financial and tourism records.
    button:
      text: View portfolio
      url: /projects
      icon: hero/arrow-down-tray
  - role: Data Engineer Intern
    org: NXP Semiconductors
    start: 2023-08-15
    end: 2024-06-30
    summary: |
      - Designed a monitoring system in Splunk to detect data gaps in an R&D data lake.
      - Developed a Splunk dashboard to provide real-time monitoring and visibility into data streams and alert the responsible team when gaps or inconsistencies were detected.
      - Utilized AWS Glue jobs and Lambda functions for data orchestration, integrating on-premise databases with the serverless AWS architecture of the data lake.
      - Tested new features locally using Docker containers to validate functionality and dependencies before deploying to the AWS environment for further integration testing.
      - Enhanced the scalability and performance of the data lake by addressing potential bottlenecks and recommending process optimizations for long-term reliability.
      - Tracked development tasks using Jira and documented the end-to-end workﬂow in Conﬂuence to enable knowledge transfer and future improvements by the data lake management team.

